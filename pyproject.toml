[project]
name = "fibonacci-tdd-kata-matthieuringd"
version = "0.1.2"
description = "A test-driven Fibonacci kata with recursive, optimized, and modular implementations."
readme = "README.md"
authors = [
    { name = "Matthieu Ringard", email = "matt33.ringard@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "marimo>=0.25.0",
]

[project.scripts]
fibonacci-tdd-kata = "fibonacci_tdd_kata:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fibonacci_kata"]

[dependency-groups]
dev = [
    "marimo>=0.24.2",
    "mypy>=2.4.0",
    "pytest-cov>=5.0",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]   # pyflakes, pycodestyle, isort, pyupgrade, bugbear

[tool.ruff.lint.per-file-ignores]
# marimo cells intentionally end on a bare expression to define what the
# cell displays — that pattern is exactly what flake8-bugbear's B018
# ("useless expression") flags, so it's disabled for notebook files.
"notebooks/*.py" = ["B018"]

[tool.mypy]
strict = true
files = ["src"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
fail_under = 90

