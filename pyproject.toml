[project]
name = "fibonacci-kata"
version = "0.1.0"
description = "A test-driven Fibonacci kata with recursive, optimized, and modular implementations."
readme = "README.md"
authors = [
    { name = "Matthieu Ringard", email = "matt33.ringard@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "marimo>=0.25.0",
]

[project.scripts]
fibonacci-tdd-kata = "fibonacci_tdd_kata:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fibonacci_kata"]

[dependency-groups]
dev = [
    "marimo>=0.24.2",
    "pytest-cov>=5.0",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

